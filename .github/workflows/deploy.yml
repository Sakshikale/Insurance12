name: Deploy  SQL
 
on:
  push:
    branches:
      - main
    paths:
      - "sql/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
 
permissions:
  contents: read
 
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install Snowflake CLI
        run: pip install snowflake-cli
 
      - name: Configure Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          snow connection add \
            --connection-name ci \
            --account "$SNOWFLAKE_ACCOUNT" \
            --user "$SNOWFLAKE_USER" \
            --password "$SNOWFLAKE_PASSWORD" \
            --role ACCOUNTADMIN \
            --warehouse COMPUTE_WH \
            --database INSURANCE_DW \
            
            --no-interactive
 
      - name: Test Snowflake connection
        run: |
          snow sql --connection ci \
            --query "SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_WAREHOUSE();"
 
      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/BR_CLAIMS.sql
 
      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/BR_CUSTOMERS.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/BR_POLICIES.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/BR_PREMIUMS.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/SLV_CLAIMS.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/SLV_CUSTOMERS.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/SLV_POLICIES.sql


      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/SLV_PREMIUMS.sql

      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/DIM_CUSTOMER.sql


      - name: Deploy Snowflake objects
        run: |
          snow sql --connection ci \
            --filename sql/DIM_POLICY.sql

            
      
         
